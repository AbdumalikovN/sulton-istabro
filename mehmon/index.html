<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Именные приглашения — Султонбек ва Истабро</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/style.css">
<style>
  body{background:radial-gradient(130% 85% at 50% 0%,#A3A97C 0%,#8E9468 42%,#747B4F 82%) fixed;min-height:100vh}
  .wrap{width:min(100%,620px);margin:0 auto;padding:48px 20px 80px}
  h1{margin:0;font-style:italic;font-weight:400;font-size:clamp(2rem,8vw,2.7rem);line-height:1.15;color:var(--paper)}
  .lead{margin-top:.6em;color:var(--soft)}
  label{display:block;margin:28px 0 8px;font-weight:600;color:var(--paper)}
  textarea,select{
    width:100%;padding:14px 16px;border-radius:4px;border:1px solid rgba(207,168,80,.6);
    background:rgba(251,246,232,.85);color:var(--ink);font:500 1.05rem/1.5 var(--serif);
  }
  textarea{min-height:170px;resize:vertical}
  select option{color:#111}
  .row{color:var(--ink)} .row code{color:#5E5546} .acts a,.acts button{color:var(--gold-lo)}
  .note{margin-top:6px;font-style:italic;font-size:.95rem;color:var(--soft)}
  .make{margin-top:22px;max-width:none}
  .out{margin-top:34px;display:grid;gap:14px}
  .row{padding:16px 16px 14px;border:1px solid rgba(207,168,80,.45);border-radius:4px;background:rgba(251,246,232,.9)}
  .row b{display:block;font-size:1.15rem;font-weight:600}
  .row code{display:block;margin-top:4px;font:400 .82rem/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--soft);word-break:break-all}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .acts a,.acts button{
    padding:8px 14px;border-radius:999px;border:1px solid rgba(207,168,80,.7);background:none;cursor:pointer;
    color:var(--paper);font:600 .95rem/1.2 var(--serif);text-decoration:none;
  }
  .acts button.is-done{background:var(--foil);color:var(--ink)}
  .empty{font-style:italic;color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Именные приглашения</h1>
  <p class="lead">Впишите гостей — для каждого получится своя ссылка. На конверте и в письме будет стоять его имя: «Ҳурматли Алишер ака!»</p>

  <label for="names">Гости, по одному в строке</label>
  <textarea id="names" placeholder="Алишер ака&#10;Дилноза опа оиласи билан&#10;Рустам Каримов"></textarea>
  <p class="note">Пишите так, как должно стоять после слова «Ҳурматли».</p>

  <label for="til">Язык приглашения</label>
  <select id="til">
    <option value="kr">Ўзбекча (кирилл) — как на бумажном</option>
    <option value="uz">O‘zbekcha (lotin)</option>
    <option value="ru">Русский</option>
  </select>

  <button class="btn make" id="make" type="button">Создать ссылки</button>

  <div class="out" id="out" aria-live="polite"></div>
</div>

<script>
(() => {
  const base = location.origin + location.pathname.replace(/mehmon\/(index\.html)?$/, '');
  const msg = {
    kr: n => `Ассалому алайкум, ${n}! Сизни Султонбек ва Истабронинг никоҳ тўйига таклиф этамиз:`,
    uz: n => `Assalomu alaykum, ${n}! Sizni Sultonbek va Istabroning nikoh to‘yiga taklif etamiz:`,
    ru: n => `Ассалому алайкум, ${n}! Приглашаем Вас на свадьбу Султонбека и Истабро:`,
  };
  const out = document.getElementById('out');

  function row(name, til) {
    const q = new URLSearchParams({ m: name });
    if (til !== 'kr') q.set('til', til);
    const url = base + '?' + q.toString();
    const text = msg[til](name);
    const el = document.createElement('div'); el.className = 'row';
    const b = document.createElement('b'); b.textContent = name;
    const code = document.createElement('code'); code.textContent = url;
    const acts = document.createElement('div'); acts.className = 'acts';

    const copy = document.createElement('button'); copy.type = 'button'; copy.textContent = 'Скопировать';
    copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(text + '\n' + url); }
      catch (e) { const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); }
      copy.textContent = 'Скопировано'; copy.classList.add('is-done');
      setTimeout(() => { copy.textContent = 'Скопировать'; copy.classList.remove('is-done'); }, 1600);
    });
    const tg = document.createElement('a'); tg.textContent = 'Telegram'; tg.target = '_blank'; tg.rel = 'noopener';
    tg.href = 'https://t.me/share/url?' + new URLSearchParams({ url, text });
    const wa = document.createElement('a'); wa.textContent = 'WhatsApp'; wa.target = '_blank'; wa.rel = 'noopener';
    wa.href = 'https://wa.me/?' + new URLSearchParams({ text: text + ' ' + url });
    const see = document.createElement('a'); see.textContent = 'Открыть'; see.target = '_blank'; see.rel = 'noopener'; see.href = url;

    acts.append(copy, tg, wa, see); el.append(b, code, acts);
    return el;
  }

  document.getElementById('make').addEventListener('click', () => {
    const til = document.getElementById('til').value;
    const names = document.getElementById('names').value.split('\n').map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
    out.textContent = '';
    if (!names.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Впишите хотя бы одно имя — по одному в строке.'; out.append(p); return; }
    names.forEach(n => out.append(row(n.slice(0, 60), til)));
  });
})();
</script>
</body>
</html>
